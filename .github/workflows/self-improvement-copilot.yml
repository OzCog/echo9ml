---
name: Self-Improvement with Copilot

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight

jobs:
  self_improvement:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || echo "Failed to install some dependencies"

      - name: Run Copilot suggestions script
        run: |
          python copilot_suggestions.py || echo "Copilot suggestions completed"
