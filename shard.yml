name: crystal-echo
version: 1.0.0
description: Deep Tree Echo Crystal Lucky Chatbot Interface with real node-llama-cpp inference

authors:
  - Deep Tree Echo Team

crystal: ">= 1.0.0"

dependencies:
  lucky:
    github: luckyframework/lucky
    version: ~> 1.0.0
  uuid:
    github: crystal-lang/crystal-uuid
    version: ~> 1.0.0
  json:
    github: crystal-lang/crystal-json
    version: ~> 0.1.0
  http:
    github: crystal-lang/crystal-http
    version: ~> 0.1.0

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: ~> 1.4.0

targets:
  crystal-echo:
    main: crystal-echo.cr
  crystal-echo-server:
    main: crystal_echo_server.cr

scripts:
  postinstall: "shards install"

license: MIT